name: Update market data

on:
  schedule:
    # 매일 미국 장 마감 후 실행 (21:30 UTC = 17:30 EDT / 16:30 EST, 화~토 UTC = 미국 월~금 저녁)
    - cron: "30 21 * * 2-6"
    # 미국 장중 2시간 간격 갱신 (14:30~20:30 UTC = 10:30~16:30 EDT, 점수·재무 최신화)
    - cron: "30 14,16,18,20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance requests curl_cffi

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json 변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update market data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
