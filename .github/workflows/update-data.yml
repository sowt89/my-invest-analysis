name: Update market data

on:
  schedule:
    # 미국 장중(약 13:30~21:00 UTC, 서머타임 기준) 30분 간격 갱신
    - cron: "0,30 13-21 * * 1-5"
    # 장외·주말 2시간 간격 — 실질 데이터 변경이 없으면 커밋은 생략됨
    - cron: "30 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance requests curl_cffi

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Commit and push data.json
        run: |
          # updated_at 타임스탬프만 바뀐 경우(장외·주말)는 커밋하지 않는다
          # (단, history.json에 새 스냅샷이 추가된 날 첫 실행은 커밋)
          HIST_CHANGED=$(git status --porcelain -- history.json archive)
          if [ -z "$HIST_CHANGED" ] && git cat-file -e HEAD:data.json 2>/dev/null; then
            jq -S 'del(.updated_at,.updated_at_kst)' data.json > /tmp/new.json
            git show HEAD:data.json | jq -S 'del(.updated_at,.updated_at_kst)' > /tmp/old.json
            if cmp -s /tmp/new.json /tmp/old.json; then
              echo "실질 데이터 변경 없음 — 커밋 생략"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          # archive/는 3년 지난 기록이 처음 생길 때까지 존재하지 않는다
          if [ -d archive ]; then git add archive; fi
          MSG="chore: update market data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git commit -m "$MSG"
          # 두 스케줄이 겹쳐 동시에 돌면 뒤늦은 push가 거부된다.
          # 최신 main 위에 우리 결과를 다시 얹어 재시도한다 (생성 파일이라 나중 값이 맞다)
          for i in 1 2 3; do
            git push && exit 0
            echo "push 거부 — 최신 main 위에 다시 얹어 재시도 ($i/3)"
            git fetch origin main
            git reset --soft origin/main
            git commit -m "$MSG" || exit 0     # 차이가 없으면 이미 반영된 것
          done
          echo "3회 재시도 실패"
          exit 1
