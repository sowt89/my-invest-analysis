name: Research (manual)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "실행할 스크립트 (scripts/ 하위)"
        required: true
        default: "sec_probe.py"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests curl_cffi
      - run: python "scripts/${{ inputs.script }}"

      - name: Commit dataset if produced
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: SEC point-in-time 데이터셋 갱신"
            git push
          fi
